services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=diarapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: always

  web:
    build: .
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/backend/media  # NEW: Persist receipts safely
    ports:
      - "8000:8000"
    depends_on:
      - db

  nginx:
    image: nginx:1.31.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/backend/media  # NEW: Allow Nginx to read the receipts
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:  # NEW: Register the persistent volume for media