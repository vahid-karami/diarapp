<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیار اپ | سیستم مدیریت هزینه‌ها</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body { 
            /* اعمال فونت وزیرمتن به کل سایت */
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif !important; 
            background-color: #f4f6f9; 
        }
        
        .navbar-custom {
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            border-bottom: 4px solid #ffc107;
        }
        
        .navbar-brand { font-weight: 800; font-size: 1.5rem; }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        
        .nav-link:hover {
            color: #ffc107 !important;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .user-badge {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50rem;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-content { margin-top: 2rem; padding-bottom: 4rem; }
        .card { border-radius: 1rem; border: none; }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-lg py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-wallet2 text-warning ms-2"></i>
                دیار اپ
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 pe-lg-3 mt-3 mt-lg-0">
                    <li class="nav-item mb-2 mb-lg-0 ms-lg-2">
                        <a class="nav-link text-white d-flex align-items-center" href="{% url 'dashboard:index' %}">
                            <i class="bi bi-speedometer2 ms-2 fs-5"></i> داشبورد
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white d-flex align-items-center" href="{% url 'dashboard:reports' %}">
                            <i class="bi bi-bar-chart-fill ms-2 fs-5"></i> گزارش‌ها
                        </a>
                    </li>
                </ul>

                <div class="d-flex text-white align-items-center mt-3 mt-lg-0 flex-wrap gap-3">
                    <div class="user-badge d-flex align-items-center">
                        <i class="bi bi-person-circle ms-2 fs-5 text-warning"></i>
                        <span class="fw-bold">{{ request.user.username }}</span>
                    </div>
                    
                    <a href="{% url 'admin:logout' %}" class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm d-flex align-items-center">
                        <i class="bi bi-box-arrow-right ms-2"></i> خروج
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
