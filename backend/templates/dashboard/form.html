{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-white border-bottom py-4 text-center rounded-top-4">
                <h4 class="mb-0 fw-bold text-primary">{{ page_title }}</h4>
            </div>
            <div class="card-body p-4 p-md-5">
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark mb-2">{{ field.label }}</label>
                            {{ field }}
                            
                            {% if field.help_text %}
                                <div class="form-text text-muted mt-1"><small>{{ field.help_text }}</small></div>
                            {% endif %}
                            
                            {% for error in field.errors %}
                                <div class="text-danger mt-2 fw-bold"><i class="bi bi-exclamation-triangle ms-1"></i> {{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-flex justify-content-end mt-5 gap-3">
                        <a href="{% url 'dashboard:index' %}" class="btn btn-light shadow-sm px-4 fw-bold">انصراف</a>
                        <button type="submit" class="btn btn-primary shadow-sm px-5 fw-bold text-white">ذخیره اطلاعات</button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
