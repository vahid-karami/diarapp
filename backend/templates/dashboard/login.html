{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | دیار اپ</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif !important;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            border-radius: 1.5rem;
            border: none;
            overflow: hidden; 
        }
        
        .login-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            min-height: 500px;
        }
        
        .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            background-color: #fff;
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card login-card shadow-lg">
                    <div class="row g-0">
                        
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5">
                                
                                <div class="text-center mb-4">
                                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 70px; height: 70px;">
                                        <i class="bi bi-wallet2 fs-2"></i>
                                    </div>
                                    <h3 class="fw-bold text-dark">دیار</h3>
                                </div>

                                <form method="post">
                                    {% csrf_token %}
                                    
                                    {% if form.errors %}
                                        <div class="alert alert-danger py-2 small text-center mb-3 rounded-3 shadow-sm">
                                            نام کاربری یا رمز عبور اشتباه است.
                                        </div>
                                    {% endif %}

                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-secondary">نام کاربری</label>
                                        <input type="text" name="username" class="form-control" required autofocus>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-bold small text-secondary">رمز عبور</label>
                                        <input type="password" name="password" class="form-control" required>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm text-white mt-2">
                                        ورود به داشبورد <i class="bi bi-box-arrow-in-left ms-2"></i>
                                    </button>
                                </form>

                            </div>
                        </div>

                        <div class="col-md-6 d-none d-md-block">
                            <img src="{% static 'img/diar_login.jpg' %}" alt="دیار اپ" class="login-image">
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
