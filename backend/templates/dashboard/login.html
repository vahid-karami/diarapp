<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | دیار اپ</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif !important;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 1.5rem;
            border: none;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card shadow-lg p-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 70px; height: 70px;">
                                <i class="bi bi-wallet2 fs-2"></i>
                            </div>
                            <h3 class="fw-bold text-dark">دیار اپ</h3>
                            <p class="text-muted small">لطفاً برای ورود به سیستم حساب کاربری خود وارد شوید</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            
                            {% if form.errors %}
                                <div class="alert alert-danger py-2 small text-center mb-3">
                                    نام کاربری یا رمز عبور اشتباه است.
                                </div>
                            {% endif %}

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">نام کاربری</label>
                                <input type="text" name="username" class="form-control shadow-sm" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-secondary">رمز عبور</label>
                                <input type="password" name="password" class="form-control shadow-sm" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm text-white">
                                ورود به سیستم <i class="bi bi-box-arrow-in-left ms-2"></i>
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
