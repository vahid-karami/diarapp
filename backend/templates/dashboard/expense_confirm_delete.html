{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4 border-top border-danger border-4">
            <div class="card-body p-5 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-4"></i>
                <h3 class="fw-bold mb-3">حذف هزینه</h3>
                <p class="text-muted mb-4">آیا از حذف این هزینه به مبلغ <strong class="text-dark">{{ object.amount }} تومان</strong> در پروژه <strong class="text-dark">{{ object.project.name }}</strong> اطمینان دارید؟ این عمل غیرقابل بازگشت است.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'dashboard:project_detail' object.project.pk %}" class="btn btn-light px-4 fw-bold">انصراف</a>
                        <button type="submit" class="btn btn-danger px-5 fw-bold text-white">بله، حذف کن</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
